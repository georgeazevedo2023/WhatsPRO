name: Build and Push Docker Image

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: georgeazevedo2023/whatspro

jobs:
  # ── Gate de qualidade (auditoria 2026-06-14) ──────────────────────────────
  # Bloqueia o deploy a produção se tsc, eslint ou os testes falharem. Antes deste
  # job o push ia direto a crm.wsmart.com.br sem barreira (o `vite build` do
  # Dockerfile não faz typecheck). Node 20 = paridade com o Dockerfile.
  quality-gate:
    runs-on: ubuntu-latest
    env:
      # Públicas (já no Dockerfile e no bundle servido a todo browser — NÃO são segredo).
      # O client supabase dá throw no import sem elas; vitest auto-carrega .env.local
      # localmente (gitignorado), mas no CI não existe → suíte falhava sem isto.
      VITE_SUPABASE_URL: https://prfcbfumyrrycsrcrvms.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ayu87rwh94XQcMt1_1ka_w_hOQy8rZe
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      # Gate DURO = tsc + testes (a barra do RULES.md: "0 erros TS + 100% testes").
      # São os checks que pegam o que QUEBRA prod e estão verdes.
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
      # Gate DURO de referências indefinidas (lição v7.120.1: `useRef` sem
      # import passa no tsc via global UMD do React e explode em runtime).
      - name: Undef gate (eslint no-undef)
        run: npx eslint --config eslint.undef.config.js src --quiet
      - name: Tests (vitest)
        run: npm run test
      # Lint é INFORMATIVO (não bloqueia): ~218 erros pré-existentes em src/
      # (no-explicit-any, ban-ts-comment) = dívida separada da auditoria 2026-06-14.
      # Quando zerada, remover continue-on-error pra virar gate duro.
      - name: Lint (eslint, informativo)
        run: npm run lint
        continue-on-error: true

  build-and-push:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Redeploy automático (2026-06-09): o build+push acima NÃO atualiza o
      # servidor — o container só puxa :latest quando o webhook do Portainer é
      # chamado. Era passo MANUAL e esquecível (2 deploy-fantasmas registrados:
      # v7.73.x em 06-04 e v7.76.0 em 06-09). Secret: PORTAINER_WEBHOOK_URL.
      - name: Redeploy via Portainer webhook
        if: success()
        run: |
          if [ -z "${{ secrets.PORTAINER_WEBHOOK_URL }}" ]; then
            echo "::warning::PORTAINER_WEBHOOK_URL não configurado — redeploy manual necessário"
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}" -o /dev/null
          echo "Portainer redeploy disparado"

# Gera o APK do vendedor/atendente (mobile/ — Capacitor). Ver wiki/app-android.md.
#
# Por que no CI: a máquina de dev não tem Java nem Android SDK — o runner do
# GitHub tem os dois. O APK sai como ARTIFACT da execução: Actions > apk-whatspro
# > baixar "whatspro-apk". Receita herdada do Casa do Agricultor (2026-08-02).
#
# Secrets usados (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64  conteúdo de mobile/keystore-whatspro.p12.base64 (gerado local, fora do git)
#   ANDROID_KEYSTORE_PASS    senha em mobile/keystore-whatspro.SEGREDO.txt
#   GOOGLE_SERVICES_JSON     (fase 3, push) google-services.json do Firebase (base64 ou texto puro)
# Sem os dois primeiros: APK sai com assinatura debug (instala, mas trocar de
# assinatura depois obriga desinstalar). Sem o terceiro: APK sem push (MVP atual).
name: apk-whatspro

on:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    # secrets NÃO existem no contexto de `if:` de step (o workflow nem valida —
    # "Unrecognized named-value: 'secrets'"); espelha no env do job e testa env.
    env:
      GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instala Capacitor e sincroniza o projeto Android
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - name: Escreve google-services.json (se o secret existir — fase 3, push)
        if: env.GS_JSON != ''
        working-directory: mobile/android/app
        run: |
          # aceita o secret em texto puro OU base64
          if printf '%s' "$GS_JSON" | head -c1 | grep -q '{'; then
            printf '%s' "$GS_JSON" > google-services.json
          else
            printf '%s' "$GS_JSON" | base64 -d > google-services.json
          fi
          echo "google-services.json escrito ($(wc -c < google-services.json) bytes) — push ATIVO"

      - name: Escreve o keystore de assinatura (se o secret existir)
        if: env.KS_B64 != ''
        working-directory: mobile/android/app
        run: |
          printf '%s' "$KS_B64" | base64 -d > keystore-whatspro.p12
          echo "keystore escrito — APK sai com assinatura de RELEASE"

      - name: Build do APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          # contrato: o alias DENTRO do keystore tem que ser "whatspro" (o -name
          # da receita openssl em wiki/app-android.md; sem -name o alias vira "1"
          # e o build quebra com erro opaco de alias não encontrado)
          ANDROID_KEY_ALIAS: whatspro
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publica o APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatspro-apk
          path: mobile/android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error
          retention-days: 30
